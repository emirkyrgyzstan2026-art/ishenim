<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ишеним</title>
<style>
  body{margin:0;font-family:sans-serif;background:#f3f7f9;color:#14202b}
  header{background:#0e6e7e;color:#fff;padding:20px 16px}
  header h1{margin:0;font-size:24px}
  header p{margin:4px 0 12px;opacity:.9}
  input{width:100%;box-sizing:border-box;padding:12px;border:none;border-radius:10px;font-size:16px}
  main{padding:16px}
  h2{font-size:18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cat{background:#fff;border-radius:14px;padding:18px 8px;text-align:center;font-size:16px;font-weight:600}
  .cat span{display:block;font-size:30px}
</style>
</head>
<body>
<header>
  <h1>Ишеним</h1>
  <p>Покупайте и продавайте безопасно</p>
  <input type="search" placeholder="Что вы ищете?">
</header>
<main>
  <h2>Категории</h2>
  <div class="grid">
    <div class="cat"><span>📱</span>Телефоны</div>
    <div class="cat"><span>🚗</span>Авто</div>
    <div class="cat"><span>💻</span>Электроника</div>
    <div class="cat"><span>👕</span>Одежда</div>
    <div class="cat"><span>🛋️</span>Для дома</div>
    <div class="cat"><span>🧸</span>Детям</div>
    <div class="cat"><span>🔧</span>Инструменты</div>
    <div class="cat"><span>📦</span>Другое</div>
  </div>
</main>
</body>
</html>
