<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ишенем</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32-1.png">
<link rel="apple-touch-icon" href="icon-180-1.png">
<meta name="theme-color" content="#FF6B1A">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#f4f5f7;color:#142B4A;padding-bottom:80px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1.5px solid #dde1e7;border-radius:10px;background:#fff;margin-bottom:10px}
label{font-size:14px;font-weight:600}
header{background:#142B4A;padding:12px 14px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:38px;height:38px;border-radius:10px;display:block}
.inst{margin:12px 14px 0;padding:12px;border-radius:12px;background:#fff;border:1.5px solid #FF6B1A;display:flex;align-items:center;gap:10px;font-size:14px}
.inst b{flex:1}
.inst button{border:none;background:#FF6B1A;color:#fff;border-radius:10px;padding:9px 14px;font-weight:700}
.top b{color:#fff;font-size:24px;letter-spacing:-.5px}
header input{margin:0;border:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 14px}
.cat{flex:none;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid #dde1e7}
.cat.on{background:#FF6B1A;border-color:#FF6B1A;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.card{background:#fff;border-radius:14px;overflow:hidden}
.img{height:110px;text-align:center;line-height:110px;font-size:52px}
.info{padding:10px}
.price{font-weight:800;font-size:18px}
.name{font-size:14px;margin:2px 0}
.city{font-size:12px;color:#6b7785}
.safe{display:inline-block;margin:6px 0;font-size:12px;background:#e5f6ec;color:#17794a;padding:3px 10px;border-radius:999px}
.empty{grid-column:1/3;text-align:center;color:#6b7785;padding:40px 14px}
.bar{display:flex;align-items:center;gap:10px;padding:14px;background:#142B4A;color:#fff}
.bk{background:none;border:none;color:#fff;font-size:22px;padding:0 6px}
.big{height:200px;text-align:center;line-height:200px;font-size:90px}
.pad{padding:14px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:#FF6B1A;color:#fff;font-size:16px;font-weight:700;margin-top:10px}
.btn.alt{background:#fff;color:#142B4A;border:1.5px solid #dde1e7}
.btn.dark{background:#142B4A}
.btn.red{background:#fff;color:#c0392b;border:1.5px solid #f1c6c1;padding:8px;font-size:14px;margin:0;width:auto}
.row{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:12px;margin-bottom:10px}
.row .e{font-size:30px}
.row .t{flex:1;min-width:0}
.row small{color:#6b7785;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{padding:14px 14px 140px}
.m{max-width:80%;padding:9px 13px;border-radius:14px;background:#fff;margin-bottom:8px}
.m.me{margin-left:auto;background:#FF6B1A;color:#fff}
.send{position:fixed;left:0;right:0;bottom:62px;display:flex;gap:8px;padding:8px 14px;background:#f4f5f7}
.send input{margin:0}
.send button{border:none;background:#FF6B1A;color:#fff;border-radius:10px;padding:0 18px;font-size:18px}
.ava{width:70px;height:70px;border-radius:50%;background:#FF6B1A;color:#fff;font-size:32px;font-weight:800;text-align:center;line-height:70px;margin:0 auto 10px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.st{background:#fff;border-radius:12px;padding:12px;text-align:center;font-size:12px}
.st b{display:block;font-size:22px}
h3{margin:18px 0 8px}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dde1e7;padding:4px;z-index:10}
nav button{background:none;border:none;padding:6px 0;font-size:11px;color:#6b7785}
nav button span{display:block;font-size:22px}
nav button.on{color:#FF6B1A;font-weight:700}
.auth{position:fixed;left:0;right:0;top:0;bottom:0;background:#fff;overflow-y:auto;z-index:50;padding:0 20px 30px;text-align:center}
.auth .in{max-width:400px;margin:0 auto;padding-top:22px}
.auth img{display:block;margin:0 auto;mix-blend-mode:multiply}
.auth .lgw{width:190px}
.auth .ill{width:150px;margin-top:14px}
.auth h1{font-size:21px;margin:12px 0 10px;line-height:1.25;color:#142B4A}
.auth p{margin:0 0 16px;color:#3d4f66;line-height:1.4;font-size:15px}
.sb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border:1.5px solid #dde1e7;border-radius:999px;background:#fff;font-size:16px;font-weight:500;margin-bottom:10px;color:#142B4A}
.sb svg{flex:none}
.pl{text-align:left;font-size:13px;color:#3d4f66;margin:12px 0 4px}
.ph{display:flex;border:1.5px solid #e6b98f;border-radius:14px;overflow:hidden;margin-bottom:14px;background:#fff}
.ph b{background:#e9ecf1;padding:14px 16px;font-size:17px;font-weight:500;color:#142B4A}
.ph input{border:none;margin:0;border-radius:0;font-size:17px;padding:14px;color:#c4601a;letter-spacing:.5px;min-width:0}
.ph input:focus{outline:none}
.pill{display:block;width:100%;padding:15px;border:none;border-radius:999px;background:#FF6B1A;color:#fff;font-size:17px;font-weight:600;box-shadow:0 6px 18px rgba(255,107,26,.3)}
.pill.blue{background:#2A5CA0;box-shadow:0 6px 18px rgba(42,92,160,.3)}
.boxes{display:flex;gap:10px;justify-content:center;margin:6px 0 16px}
.cb{width:62px;height:62px;border-radius:16px;border:2px solid transparent;background:#142B4A;color:#fff;text-align:center;font-size:28px;font-weight:600;padding:0;margin:0}
.cb:focus{outline:none;border-color:#3b8cff;box-shadow:0 0 12px rgba(59,140,255,.6)}
.lk{background:none;border:none;color:#142B4A;text-decoration:underline;margin-top:14px;font-size:14px}
.sp{margin-top:26px}
.dots{display:flex;align-items:center;justify-content:center}
.d{width:16px;height:16px;border-radius:50%;background:#d3d8e0;display:block;flex:none;color:#fff;font-size:10px;line-height:16px;font-style:normal}
.d.dn{background:#142B4A}
.d.on{background:#fff;border:4px solid #FF6B1A;width:18px;height:18px}
.ln{height:2px;background:#d3d8e0;flex:1;max-width:90px;display:block}
.ln.dn{background:#142B4A}
.lbs{display:flex;justify-content:space-between;font-size:12px;color:#9aa4af;margin-top:8px}
.lbs span.on{color:#142B4A;font-weight:600}
.lbs span.dn{color:#142B4A}
.dm{font-size:12px;color:#8a4a1c;background:#fff4ec;border-radius:10px;padding:8px 10px;margin-bottom:12px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
window.onerror=function(m,s,l){document.getElementById("app").innerHTML='<pre style="padding:14px;white-space:pre-wrap">Ошибка: '+m+' (строка '+l+')</pre>'};

var CATS=["Все","Телефоны","Авто","Электроника","Одежда","Для дома","Детям","Инструменты"];
var EM={"Телефоны":"📱","Авто":"🚗","Электроника":"💻","Одежда":"👕","Для дома":"🛋️","Детям":"🧸","Инструменты":"🔧"};
var CITIES=["Бишкек","Ош","Каракол","Джалал-Абад","Нарын","Талас","Баткен"];
var items=[
 {id:1,n:"iPhone 13, 128 ГБ",p:48000,c:"Телефоны",e:"📱",bg:"#dbe7ff",city:"Бишкек",s:"TechMarket",safe:1,d:"Отличное состояние, батарея 89%. Коробка и кабель."},
 {id:2,n:"Samsung Galaxy S23",p:52000,c:"Телефоны",e:"📱",bg:"#e3dbff",city:"Бишкек",s:"Mobile Pro",safe:1,d:"Небольшая потёртость на рамке, экран идеальный."},
 {id:3,n:"Redmi Note 12",p:17500,c:"Телефоны",e:"📱",bg:"#ffe7d1",city:"Ош",s:"Айбек",safe:0,d:"Пользовался 8 месяцев, работает без проблем."},
 {id:4,n:"Toyota Camry 2015",p:1450000,c:"Авто",e:"🚗",bg:"#ffd9d4",city:"Бишкек",s:"Авто Центр",safe:1,d:"Один хозяин, не бита, не крашена."},
 {id:5,n:"Honda Fit 2012",p:620000,c:"Авто",e:"🚙",bg:"#d4f0ff",city:"Ош",s:"Нурлан",safe:1,d:"Экономичная, в хорошем состоянии."},
 {id:6,n:"Ноутбук Lenovo",p:32000,c:"Электроника",e:"💻",bg:"#dff5e6",city:"Бишкек",s:"Алина",safe:1,d:"16 ГБ памяти, SSD 512 ГБ."},
 {id:7,n:"Куртка зимняя",p:3200,c:"Одежда",e:"🧥",bg:"#ffe0ee",city:"Бишкек",s:"Айгерим",safe:0,d:"Размер M, носила один сезон."},
 {id:8,n:"Диван угловой",p:21000,c:"Для дома",e:"🛋️",bg:"#f1e3d3",city:"Бишкек",s:"Мебель Плюс",safe:1,d:"Раскладной, ткань не потёртая."},
 {id:9,n:"Детская коляска",p:7500,c:"Детям",e:"🧸",bg:"#ffeccf",city:"Джалал-Абад",s:"Мээрим",safe:0,d:"Лёгкая, складывается одной рукой."},
 {id:10,n:"Шуруповёрт Bosch",p:3900,c:"Инструменты",e:"🔧",bg:"#e4e9ee",city:"Бишкек",s:"Бакыт",safe:0,d:"Два аккумулятора, кейс."},
 {id:11,n:"Скотч упаковочный",p:60,c:"Для дома",e:"📦",bg:"#f5e6c8",city:"Бишкек",s:"Магазин Тундук",safe:0,d:"Прозрачный, 48 мм, 100 метров."}
];
var mine=[],favs=[],chats={},me={name:"",phone:""};
var deferred=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;if(tab==="home")renderHome();});
window.addEventListener("appinstalled",function(){deferred=null;if(tab==="home")renderHome();});
function installApp(){
  if(deferred){deferred.prompt();deferred=null;return;}
  alert("Откройте сайт в Chrome (не внутри Instagram). Нажмите ⋮ и выберите «Установить приложение». На iPhone: Поделиться → На экран Домой.");
}
var cur="Все",tab="home",prev="home",cid=0,query="";
var app=document.getElementById("app");

try{
  var sv=JSON.parse(localStorage.getItem("ishenem")||"null");
  if(sv){mine=sv.mine||[];favs=sv.favs||[];chats=sv.chats||{};me=sv.me||me;}
}catch(e){}
if(!me.logged&&!me.guest)tab="auth";
var authStep=1,authMethod="",authContact="",authPhone="",authDigits="",timer=null,sec=0;
function save(){try{localStorage.setItem("ishenem",JSON.stringify({mine:mine,favs:favs,chats:chats,me:me}));}catch(e){}}
function esc(s){
  return String(s).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;");
}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" сом";}
function allItems(){return mine.concat(items);}
function getItem(id){
  var a=allItems();
  for(var k=0;k<a.length;k++){if(String(a[k].id)===String(id))return a[k];}
  return null;
}
function val(id){return document.getElementById(id).value;}

function card(i){
  var h='<div class="card" data-act="item" data-id="'+i.id+'">';
  h+='<div class="img" style="background:'+i.bg+'">'+i.e+'</div><div class="info">';
  h+='<div class="price">'+fmt(i.p)+'</div><div class="name">'+esc(i.n)+'</div>';
  h+='<div class="city">'+esc(i.city)+(favs.indexOf(i.id)>-1?' · ❤️':'')+'</div>';
  if(i.safe)h+='<span class="safe">🛡 Безопасная сделка</span>';
  return h+'</div></div>';
}

function drawNav(){
  var nv=document.getElementById("nav");
  if(tab==="auth"){nv.style.display="none";return;}
  nv.style.display="grid";
  var t=[["home","🏠","Главная"],["favs","❤️","Избранное"],["post","➕","Подать"],["chats","💬","Чаты"],["cab","👤","Кабинет"]];
  var active=tab;
  if(tab==="detail")active=prev;
  if(tab==="chat")active="chats";
  var h="";
  for(var k=0;k<t.length;k++){
    h+='<button class="'+(t[k][0]===active?"on":"")+'" data-act="go" data-id="'+t[k][0]+'"><span>'+t[k][1]+'</span>'+t[k][2]+'</button>';
  }
  document.getElementById("nav").innerHTML=h;
}
function go(t){tab=t;render();window.scrollTo(0,0);}
function render(){
  drawNav();
  if(tab==="home")renderHome();
  else if(tab==="favs")renderFavs();
  else if(tab==="post")renderPost();
  else if(tab==="chats")renderChats();
  else if(tab==="cab")renderCab();
  else if(tab==="detail")renderDetail();
  else if(tab==="chat")renderChat();
  else if(tab==="auth")renderAuth();
}

function renderHome(){
  var h='<header><div class="top"><img class="logo" src="icon-192-1.png" alt=""><b>ishenem</b></div>';
  h+='<input id="q" type="search" placeholder="Поиск по объявлениям" value="'+esc(query)+'"></header><div class="cats">';
  for(var k=0;k<CATS.length;k++){
    h+='<button class="cat'+(CATS[k]===cur?" on":"")+'" data-act="cat" data-id="'+CATS[k]+'">'+CATS[k]+'</button>';
  }
  h+='</div>'+(deferred?'<div class="inst"><b>Установите приложение на телефон</b><button data-act="install">Установить</button></div><div style="height:10px"></div>':'')+'<div class="grid" id="grid"></div>';
  app.innerHTML=h;
  document.getElementById("q").oninput=function(){query=this.value;showGrid();};
  showGrid();
}
function showGrid(){
  var q=query.toLowerCase(),out="",a=allItems();
  for(var k=0;k<a.length;k++){
    var i=a[k];
    if((cur==="Все"||i.c===cur)&&i.n.toLowerCase().indexOf(q)>-1)out+=card(i);
  }
  document.getElementById("grid").innerHTML=out||'<div class="empty">Ничего не найдено</div>';
}

function renderFavs(){
  var out="",a=allItems();
  for(var k=0;k<a.length;k++){if(favs.indexOf(a[k].id)>-1)out+=card(a[k]);}
  app.innerHTML='<div class="bar"><b>Избранное</b></div><div style="padding-top:14px"><div class="grid">'+(out||'<div class="empty">Здесь будут объявления, которые вы отметили сердечком.</div>')+'</div></div>';
}

function renderDetail(){
  var i=getItem(cid);
  if(!i){go("home");return;}
  var fav=favs.indexOf(i.id)>-1;
  var h='<div class="bar"><button class="bk" data-act="go" data-id="'+prev+'">←</button><b>Объявление</b></div>';
  h+='<div class="big" style="background:'+i.bg+'">'+i.e+'</div><div class="pad">';
  h+='<div class="price" style="font-size:26px">'+fmt(i.p)+'</div><h2 style="margin:4px 0">'+esc(i.n)+'</h2>';
  h+='<div class="city">'+esc(i.city)+' · '+esc(i.c)+'</div>';
  if(i.safe)h+='<div class="safe">🛡 Безопасная сделка</div>';
  h+='<p>'+esc(i.d||"Без описания.")+'</p><div>Продавец: <b>'+esc(i.s)+'</b></div>';
  h+='<button class="btn" data-act="chat" data-id="'+i.id+'">💬 Написать продавцу</button>';
  h+='<button class="btn alt" data-act="fav" data-id="'+i.id+'">'+(fav?"❤️ В избранном":"🤍 В избранное")+'</button>';
  if(i.safe)h+='<button class="btn dark" data-act="buy">Купить безопасно</button>';
  app.innerHTML=h+'</div>';
}

function renderPost(){
  var h='<div class="bar"><b>Новое объявление</b></div><div class="pad">';
  h+='<label>Название</label><input id="pn" placeholder="Например, iPhone 12, 128 ГБ">';
  h+='<label>Категория</label><select id="pc">';
  for(var k=1;k<CATS.length;k++)h+='<option>'+CATS[k]+'</option>';
  h+='</select><label>Цена, сом</label><input id="pp" type="number" placeholder="45000">';
  h+='<label>Город</label><select id="pcity">';
  for(var j=0;j<CITIES.length;j++)h+='<option>'+CITIES[j]+'</option>';
  h+='</select><label>Описание</label><textarea id="pd" rows="4" placeholder="Состояние, комплект, причина продажи"></textarea>';
  h+='<button class="btn" data-act="publish">Опубликовать</button></div>';
  app.innerHTML=h;
}
function needLogin(m){if(me.logged)return false;alert(m);authStep=1;tab="auth";render();return true;}
function publish(){
  if(needLogin("Войдите, чтобы подать объявление"))return;
  var n=val("pn").trim(),p=parseInt(val("pp"),10);
  if(!n){alert("Укажите название");return;}
  if(!p||p<=0){alert("Укажите цену");return;}
  var c=val("pc");
  mine.unshift({id:Date.now(),n:n,p:p,c:c,e:EM[c]||"📦",bg:"#ffe9d9",city:val("pcity"),d:val("pd").trim(),s:me.name||"Вы",safe:0});
  save();cur="Все";query="";go("home");
}

function renderChats(){
  var keys=Object.keys(chats),h='<div class="bar"><b>Чаты</b></div><div class="pad">',n=0;
  for(var k=0;k<keys.length;k++){
    var i=getItem(keys[k]);
    if(!i)continue;
    n++;
    var a=chats[keys[k]],last=a.length?a[a.length-1].t:"Нет сообщений";
    h+='<div class="row" data-act="chat" data-id="'+i.id+'"><div class="e">'+i.e+'</div><div class="t"><b>'+esc(i.s)+'</b><small>'+esc(i.n)+'</small><small>'+esc(last)+'</small></div></div>';
  }
  if(!n)h+='<div style="text-align:center;color:#6b7785;padding:40px 0">Чатов пока нет. Откройте объявление и нажмите «Написать продавцу».</div>';
  app.innerHTML=h+'</div>';
}
function openChat(id){
  if(needLogin("Войдите, чтобы написать продавцу"))return;
  var i=getItem(id);if(!i)return;
  cid=i.id;
  if(!chats[cid])chats[cid]=[];
  save();tab="chat";render();window.scrollTo(0,0);
}
function renderChat(){
  var i=getItem(cid);
  if(!i){go("chats");return;}
  app.innerHTML='<div class="bar"><button class="bk" data-act="go" data-id="chats">←</button><b>'+esc(i.s)+'</b></div><div class="msgs" id="msgs"></div><div class="send"><input id="mi" placeholder="Сообщение"><button data-act="send">➤</button></div>';
  document.getElementById("mi").onkeydown=function(e){if(e.key==="Enter")sendMsg();};
  drawMsgs();
}
function drawMsgs(){
  var m=document.getElementById("msgs");if(!m)return;
  var a=chats[cid]||[],h="";
  for(var k=0;k<a.length;k++)h+='<div class="m'+(a[k].me?" me":"")+'">'+esc(a[k].t)+'</div>';
  m.innerHTML=h||'<div style="text-align:center;color:#6b7785">Напишите первое сообщение</div>';
  window.scrollTo(0,document.body.scrollHeight);
}
function sendMsg(){
  var inp=document.getElementById("mi"),t=inp.value.trim();
  if(!t)return;
  var id=cid;
  chats[id].push({me:1,t:t});inp.value="";save();drawMsgs();
  setTimeout(function(){
    chats[id].push({me:0,t:"Здравствуйте! Да, ещё продаётся."});save();
    if(tab==="chat"&&cid===id)drawMsgs();
  },1200);
}

function renderCab(){
  var h='<div class="bar"><b>Мой кабинет</b></div><div class="pad">';
  h+='<div class="ava">'+esc((me.name||"Я").charAt(0).toUpperCase())+'</div>';
  h+='<label>Имя</label><input id="cn" value="'+esc(me.name)+'" placeholder="Ваше имя">';
  h+='<label>Телефон</label><input id="cp" type="tel" value="'+esc(me.phone)+'" placeholder="+996 ...">';
  h+='<button class="btn" data-act="saveme">Сохранить</button>';
  h+='<div class="stats"><div class="st"><b>'+mine.length+'</b>Мои объявления</div><div class="st"><b>'+favs.length+'</b>Избранное</div><div class="st"><b>'+Object.keys(chats).length+'</b>Чаты</div></div>';
  if(me.logged)h+='<div class="safe">✅ Вы вошли: '+esc(me.contact||"")+'</div><button class="btn alt" data-act="logout">Выйти</button>';
  else h+='<button class="btn" data-act="login">Войти или зарегистрироваться</button>';
  h+='<button class="btn alt" data-act="install">📲 Установить приложение</button>';
  h+='<div class="safe">🛡 Подтверждение номера и рейтинг: скоро</div><h3>Мои объявления</h3>';
  if(!mine.length)h+='<div class="city">Вы пока ничего не подавали.</div>';
  for(var k=0;k<mine.length;k++){
    var i=mine[k];
    h+='<div class="row" data-act="item" data-id="'+i.id+'"><div class="e">'+i.e+'</div><div class="t"><b>'+esc(i.n)+'</b><small>'+fmt(i.p)+'</small></div><button class="btn red" data-act="del" data-id="'+i.id+'">Удалить</button></div>';
  }
  app.innerHTML=h+'</div>';
}


function startTimer(){
  stopTimer();sec=59;
  timer=setInterval(function(){
    sec--;
    var t=document.getElementById("tm");
    if(t)t.textContent=sec>0?"Отправить код повторно (0:"+(sec<10?"0":"")+sec+")":"Отправить код повторно";
    if(sec<=0)stopTimer();
  },1000);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function stepper(){
  var lb=["Регистрация","Подтверждение","Начало"],d="",l="";
  for(var k=1;k<=3;k++){
    var st=k<authStep?"dn":(k===authStep?"on":"");
    d+='<i class="d '+st+'">'+(k<authStep?"✓":"")+'</i>';
    if(k<3)d+='<b class="ln '+(k<authStep?"dn":"")+'"></b>';
    l+='<span class="'+st+'">'+lb[k-1]+'</span>';
  }
  return '<div class="sp"><div class="dots">'+d+'</div><div class="lbs">'+l+'</div></div>';
}
function renderAuth(){
  var G='<svg width="22" height="22" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';
  var T='<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2AABEE"/><path fill="#fff" d="M5.4 11.9l11.2-4.3c.5-.2 1 .1.8.9l-1.9 9c-.1.6-.5.8-1 .5l-2.9-2.1-1.4 1.3c-.2.2-.3.3-.6.3l.2-3 5.4-4.9c.2-.2-.1-.3-.4-.1l-6.7 4.2-2.9-.9c-.6-.2-.6-.6.2-.9z"/></svg>';
  var h='<div class="auth"><div class="in"><img class="lgw" src="auth-logo.png" alt="Ишенем" onerror="this.style.display=\'none\'">';
  if(authStep===1){
    h+='<img class="ill" src="auth-shield.png" alt="" onerror="this.style.display=\'none\'"><h1>Добро пожаловать в Ишенем</h1>';
    h+='<button class="sb" data-act="a-google">'+G+'Войти через Google</button>';
    h+='<button class="sb" data-act="a-tg">'+T+'Войти через Telegram</button>';
    h+='<div class="pl">Номер телефона</div><div class="ph"><b>+996</b><input id="ph" type="tel" inputmode="numeric" placeholder="700 123 456" value="'+esc(authPhone)+'"></div>';
    h+='<button class="pill" data-act="a-phone">Продолжить</button>';
    h+='<button class="lk" data-act="a-guest">Смотреть без входа</button>';
  } else if(authStep===2){
    var last=authDigits.slice(-4);
    h+='<img class="ill" src="auth-sms.png" alt="" onerror="this.style.display=\'none\'"><h1>Введите код подтверждения</h1>';
    h+='<p>'+(authMethod==="tg"?'Мы отправили 4-значный код в Telegram от бота Ишенем':'Мы отправили 4-значный код на ваш номер +996 (***) *** '+esc(last))+'</p>';
    h+='<div class="dm">Демо-режим: настоящая отправка кода подключится позже. Сейчас введите любые 4 цифры.</div>';
    h+='<div class="boxes"><input class="cb" id="c0" type="tel" inputmode="numeric" maxlength="1"><input class="cb" id="c1" type="tel" inputmode="numeric" maxlength="1"><input class="cb" id="c2" type="tel" inputmode="numeric" maxlength="1"><input class="cb" id="c3" type="tel" inputmode="numeric" maxlength="1"></div>';
    h+='<button class="pill blue" data-act="a-verify">🎉 Подтвердить 🎉</button>';
    h+='<button class="lk" id="tm" data-act="a-resend">'+(sec>0?'Отправить код повторно (0:'+(sec<10?'0':'')+sec+')':'Отправить код повторно')+'</button><br>';
    h+='<button class="lk" data-act="a-back">← Назад</button>';
  } else {
    h+='<img class="ill" style="width:210px" src="auth-gift.png" alt="" onerror="this.style.display=\'none\'"><h1>Добро пожаловать<br>в Ишенем!</h1>';
    h+='<p>Ваш аккаунт успешно создан. Теперь вы можете покупать и продавать безопасно.</p>';
    h+='<button class="pill" data-act="a-start">Начать</button>';
  }
  app.innerHTML=h+stepper()+'</div></div>';
  if(authStep===2){setTimeout(function(){var c=document.getElementById("c0");if(c&&c.focus)c.focus();},50);}
}

document.addEventListener("click",function(e){
  var el=e.target;
  while(el&&el!==document&&!(el.getAttribute&&el.getAttribute("data-act")))el=el.parentNode;
  if(!el||el===document)return;
  var act=el.getAttribute("data-act"),id=el.getAttribute("data-id");
  if(act==="go")go(id);
  else if(act==="cat"){cur=id;renderHome();}
  else if(act==="item"){if(tab!=="detail")prev=tab;cid=id;tab="detail";render();window.scrollTo(0,0);}
  else if(act==="fav"){var n=Number(id),p=favs.indexOf(n);if(p>-1)favs.splice(p,1);else favs.push(n);save();renderDetail();}
  else if(act==="chat")openChat(id);
  else if(act==="send")sendMsg();
  else if(act==="publish")publish();
  else if(act==="saveme"){me.name=val("cn").trim();me.phone=val("cp").trim();save();alert("Сохранено");renderCab();}
  else if(act==="del"){
    if(confirm("Удалить объявление?")){
      mine=mine.filter(function(x){return String(x.id)!==String(id);});
      save();renderCab();
    }
  }
  else if(act==="a-google")alert("Вход через Google подключим после Supabase. Пока используйте номер телефона или Telegram.");
  else if(act==="a-tg"){authMethod="tg";authContact="Telegram";authStep=2;startTimer();renderAuth();}
  else if(act==="a-phone"){
    var dg=val("ph").replace(/[^0-9]/g,"");
    if(dg.length!==9){alert("Введите номер полностью: 9 цифр после +996");}
    else{authMethod="phone";authDigits=dg;authPhone=val("ph");authContact="+996 "+val("ph");authStep=2;startTimer();renderAuth();}
  }
  else if(act==="a-verify"){
    var cd=val("c0")+val("c1")+val("c2")+val("c3");
    if(!/^[0-9]{4}$/.test(cd)){alert("Введите 4 цифры");}
    else{stopTimer();me.logged=true;me.guest=false;me.method=authMethod;me.contact=authContact;if(authMethod==="phone")me.phone=authDigits;save();authStep=3;renderAuth();}
  }
  else if(act==="a-resend"){if(sec<=0){startTimer();alert("Код отправлен повторно (демо)");}}
  else if(act==="a-back"){stopTimer();authStep=1;renderAuth();}
  else if(act==="a-start"){authStep=1;go("home");}
  else if(act==="a-guest"){me.guest=true;save();go("home");}
  else if(act==="login"){authStep=1;go("auth");}
  else if(act==="logout"){if(confirm("Выйти из аккаунта?")){me.logged=false;me.guest=false;me.contact="";save();authStep=1;go("auth");}}
  else if(act==="install")installApp();
  else if(act==="buy")alert("Скоро: оплата через Элсом, Мбанк или Оптима. Деньги хранятся у платформы, пока вы не получите товар.");
});

document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="ph"){
    var d=t.value.replace(/[^0-9]/g,"");
    if(d.indexOf("996")===0&&d.length>9)d=d.slice(3);
    if(d.charAt(0)==="0"&&d.length>9)d=d.slice(1);
    d=d.slice(0,9);
    var f=d.slice(0,3);if(d.length>3)f+=" "+d.slice(3,6);if(d.length>6)f+=" "+d.slice(6,9);
    t.value=f;authPhone=f;
  } else if(t.classList&&t.classList.contains("cb")){
    var v=t.value.replace(/[^0-9]/g,"");
    t.value=v.slice(-1);
    if(t.value){var n=document.getElementById("c"+(Number(t.id.charAt(1))+1));if(n&&n.focus)n.focus();}
  }
});
document.addEventListener("keydown",function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains("cb")&&e.key==="Backspace"&&!t.value){
    var p=document.getElementById("c"+(Number(t.id.charAt(1))-1));if(p&&p.focus)p.focus();
  }
});

render();
</script>
